# sojeongcompose — 클라우드 빌드 (Windows · macOS · Linux 매트릭스)
#
# 업스트림 MuseScore(v4.7.3)를 체크아웃 → 국악 overlay 적용 → 빌드 → 산출물 업로드.
# 수동 실행(workflow_dispatch)으로 비용을 통제한다(빌드 1회 ~1-2h, Actions 분 소모).
#
# ⚠ 이 워크플로는 v1 시작점이다. MuseScore 풀빌드는 의존성·Qt 모듈·패키징이 까다로워
#   첫 시도에 통과하지 못할 수 있다. 실패 로그를 보고 Qt 모듈/플래그/의존성을 반복 보정한다.
#   서명은 하지 않으므로 산출물 실행 시 OS가 "확인되지 않은 개발자" 경고를 띄운다.
name: Build sojeongcompose

on:
  # 수동 실행 + 워크플로 파일 수정 푸시 시 자동 실행(디버깅 반복용).
  # (API dispatch 권한이 없어, 워크플로 파일 푸시를 트리거로 사용한다.)
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "빌드할 업스트림 MuseScore 태그"
        default: "v4.7.3"
        required: true
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-sojeongcompose.yml"

# push 이벤트엔 inputs가 없으므로 기본 태그를 env로 보강
env:
  UPSTREAM_TAG: ${{ github.event.inputs.upstream_tag || 'v4.7.3' }}

# 동시 실행 제한(불필요한 중복 빌드 방지)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 디버깅 단계: Linux 1개로 레시피를 초록불 만든 뒤 macOS/Windows 재활성화.
        include:
          - os: ubuntu-22.04
            name: linux
          # - os: macos-14
          #   name: macos
          # - os: windows-2022
          #   name: windows
    steps:
      - name: 국악 overlay(이 레포) 체크아웃
        uses: actions/checkout@v4
        with:
          path: sojeong

      - name: MuseScore 업스트림 체크아웃 (${{ github.event.inputs.upstream_tag }})
        uses: actions/checkout@v4
        with:
          repository: musescore/MuseScore
          ref: ${{ env.UPSTREAM_TAG }}
          path: MuseScore
          submodules: recursive

      - name: 국악 overlay 적용
        shell: bash
        run: cp -R sojeong/overlay/. MuseScore/

      - name: Ninja 설치
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Qt 6.8 설치
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          # MuseScore 4가 요구하는 모듈(실패 로그 보고 가감). qtwebengine는 무거워 우선 제외.
          modules: qt5compat qtnetworkauth qtscxml qtshadertools qtwebsockets

      - name: 시스템 의존성 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # 업스트림 CI 스크립트가 있으면 활용(없으면 무시하고 최소 패키지 설치)
          if [ -f MuseScore/buildscripts/ci/linux/setup.sh ]; then
            sudo bash MuseScore/buildscripts/ci/linux/setup.sh || true
          fi
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libasound2-dev libjack-jackd2-dev \
            libpulse-dev libgl1-mesa-dev libdrm-dev || true

      - name: 시스템 의존성 (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -f MuseScore/buildscripts/ci/macos/setup.sh ]; then
            bash MuseScore/buildscripts/ci/macos/setup.sh || true
          fi

      - name: 빌드 (Configure & Compile)
        shell: bash
        run: |
          cd MuseScore
          cmake -S . -B build.release -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMUE_COMPILE_QT5_COMPAT=OFF \
            -DMUE_BUILD_UNIT_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/install"
          cmake --build build.release --parallel
          cmake --install build.release || true

      - name: 산출물 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sojeongcompose-${{ matrix.name }}
          path: |
            MuseScore/install
            MuseScore/build.release/main
          if-no-files-found: warn
